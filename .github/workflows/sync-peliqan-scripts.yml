name: Sync Data App scripts to Peliqan

# Pushes any changed scripts/*.py to the live Peliqan account whenever they're
# committed to main. Requires a repo secret PELIQAN_API_TOKEN (a personal API
# token from Peliqan: Admin > Security settings > API token).
on:
  push:
    branches: [main]
    paths:
      - "scripts/**.py"

permissions:
  contents: write

concurrency:
  group: sync-peliqan-scripts
  cancel-in-progress: false

jobs:
  push-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Push changed scripts to Peliqan
        env:
          PELIQAN_API_TOKEN: ${{ secrets.PELIQAN_API_TOKEN }}
        run: python push_peliqan_data_apps.py

      # push_peliqan_data_apps.py updates scripts/.manifest.json locally on a
      # successful push. Commit that back so the next run's drift-detection
      # (local vs. remote hash) has an accurate baseline - otherwise every
      # future run would think the remote had changed underneath it.
      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/.manifest.json
          git diff --cached --quiet || git commit -m "chore: update Peliqan script sync manifest"
          git push
